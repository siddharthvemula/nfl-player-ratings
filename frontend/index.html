<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Weekly NFL quarterback ratings: a model's forecast of next-game EPA per dropback, with the reasons behind each rating." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%233d8af0'/><text x='50' y='67' font-size='48' font-weight='800' text-anchor='middle' fill='white' font-family='system-ui'>QB</text></svg>" />
    <meta name="theme-color" content="#0b0d12" />
    <title>QB Ratings</title>
    <!-- Apply the saved theme before first paint (dark by default), so the page never flashes the wrong one. -->
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem("qb-theme") === "light" ? "light" : "dark"; }
      catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
